<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Travels | Welcome</title>
    <!-- ADSENSE SCRIPT GOES HERE LATER -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 2rem; color: #1e293b; }
        p { font-size: 1.05rem; line-height: 1.6; color: #475569; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-primary { background-color: #2563eb; color: #ffffff; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #f1f5f9; color: #334155; }
        .btn-secondary:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Health & Travels</h1>
        <p>Explore health insights, wellness guides, and smart travel recommendations.</p>
        <div class="btn-group">
            <a href="https://sage.healthandtravels.com" class="btn btn-primary">Launch Sage App</a>
            <a href="https://newsletter.healthandtravels.com" class="btn btn-secondary">Read the Newsletter</a>
        </div>
    </div>
</body>
</html>
